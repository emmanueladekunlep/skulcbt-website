<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration - SkulCBT</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="logo">
                <img src="/static/images/skulcbt-logo.png" alt="SkulCBT Logo" style="height: 60px; width: auto; margin-bottom: 10px;">
                <h1 style="color: #002147;">Skul<span style="color: #D4AF37;">CBT</span></h1>
                <p style="color: #0B7A4B; font-weight: 600;">Become an Agent</p>
            </div>

            <div id="message" class="message hidden"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password (min 6 characters)">
                </div>

                <div class="form-group">
                    <label for="referred_by">Referral Code (Optional)</label>
                    <input type="text" id="referred_by" name="referred_by" placeholder="Enter referral code if you have one">
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <div class="links">
                <p>Already have an account? <a href="/agent/login">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Get referral code from URL if present
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const refCode = urlParams.get('ref');
            if (refCode) {
                document.getElementById('referred_by').value = refCode;
            }
        });

        function handleRegister(event) {
            event.preventDefault();

            const full_name = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const referred_by = document.getElementById('referred_by').value;
            const messageDiv = document.getElementById('message');

            messageDiv.classList.add('hidden');

            // Validate password length
            if (password.length < 6) {
                messageDiv.textContent = 'Password must be at least 6 characters long.';
                messageDiv.className = 'message error';
                messageDiv.classList.remove('hidden');
                return;
            }

            // Show loading state
            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Registering...';
            submitBtn.disabled = true;

            fetch('/api/agent/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    full_name: full_name,
                    email: email,
                    phone: phone,
                    password: password,
                    referred_by: referred_by
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    let message = data.message;
                    if (data.registration_fee === 0) {
                        message = message + ' Your registration is FREE! (First 50 agents)';
                    } else {
                        message = message + ' Registration fee: ₦' + data.registration_fee.toLocaleString();
                    }
                    messageDiv.textContent = message;
                    messageDiv.className = 'message success';
                    messageDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Registered!';
                    submitBtn.disabled = true;

                    // Redirect to login after 3 seconds
                    setTimeout(function() {
                        window.location.href = '/agent/login';
                    }, 3000);
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message error';
                    messageDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Register';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.classList.remove('hidden');
                submitBtn.textContent = 'Register';
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
