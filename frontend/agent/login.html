<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Login - SkulCBT</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <img src="/static/images/skulcbt-logo.png" alt="SkulCBT Logo" style="height: 60px; width: auto; margin-bottom: 10px;">
                <h1 style="color: #002147;">Skul<span style="color: #D4AF37;">CBT</span></h1>
                <p style="color: #0B7A4B; font-weight: 600;">Agent Portal</p>
            </div>

            <div id="message" class="message hidden"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <div class="links">
                <p>Don't have an account? <a href="/agent/register">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.classList.add('hidden');

            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            fetch('/api/agent/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message error';
                    messageDiv.classList.remove('hidden');
                    submitBtn.textContent = 'Login';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.classList.remove('hidden');
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
