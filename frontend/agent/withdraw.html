<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - SkulCBT Agent</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @media (max-width: 768px) {
            .sidebar {
                width: 100% !important;
                height: auto !important;
                position: relative !important;
                padding: 14px !important;
            }
            .sidebar-nav {
                display: flex !important;
                flex-wrap: wrap !important;
                gap: 4px !important;
                margin-top: 10px !important;
            }
            .sidebar-nav a {
                padding: 8px 12px !important;
                font-size: 13px !important;
            }
            .sidebar-footer {
                display: none !important;
            }
            .main-content {
                margin-left: 0 !important;
                padding: 14px !important;
                width: 100% !important;
            }
            .top-bar {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 8px !important;
            }
            .top-bar h1 {
                font-size: 20px !important;
            }
            .balance-display p {
                font-size: 30px !important;
            }
            .form-section {
                padding: 18px 16px !important;
            }
            .table-section {
                padding: 14px 16px !important;
                overflow-x: auto !important;
            }
            .data-table {
                font-size: 12px !important;
                min-width: 450px !important;
            }
            .data-table th,
            .data-table td {
                padding: 8px 10px !important;
            }
            .sidebar-logo img {
                height: 32px !important;
            }
            .sidebar-logo h2 {
                font-size: 20px !important;
            }
        }
        @media (max-width: 480px) {
            .balance-display p {
                font-size: 24px !important;
            }
            .balance-display {
                padding: 20px !important;
            }
            .form-section {
                padding: 14px !important;
            }
            .form-group input {
                font-size: 16px !important;
                padding: 10px 12px !important;
            }
            .data-table {
                font-size: 11px !important;
                min-width: 380px !important;
            }
            .data-table th,
            .data-table td {
                padding: 6px 8px !important;
            }
            .sidebar-nav a {
                font-size: 12px !important;
                padding: 6px 10px !important;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <img src="/static/images/skulcbt-logo.png" alt="SkulCBT Logo" style="height: 40px; width: auto; margin-bottom: 6px;">
                <h2>Skul<span style="color: #D4AF37;">CBT</span></h2>
                <p>Agent Portal</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/agent/dashboard">Dashboard</a>
                <a href="/agent/sales">My Sales</a>
                <a href="/agent/downline">My Downline</a>
                <a href="/agent/commissions">Commissions</a>
                <a href="/agent/withdraw" class="active">Withdraw</a>
                <a href="/agent/generate">Generate License</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="handleLogout()" class="btn-logout">Logout</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <h1>Withdraw</h1>
                <div class="agent-info">
                    <span id="agentName">Welcome, Agent</span>
                    <span id="agentRank" class="rank-badge">Bronze</span>
                </div>
            </div>

            <div id="message" class="message hidden"></div>

            <!-- Balance Display -->
            <div class="balance-display">
                <h2>Available Balance</h2>
                <p id="availableBalance">₦0</p>
                <p class="balance-note">Minimum withdrawal: ₦10,000</p>
            </div>

            <!-- Withdrawal Form -->
            <div class="form-section">
                <h2>Request Withdrawal</h2>
                <form id="withdrawForm" onsubmit="handleWithdraw(event)">
                    <div class="form-group">
                        <label for="amount">Amount (₦)</label>
                        <input type="number" id="amount" name="amount" required placeholder="Enter amount to withdraw" min="10000">
                    </div>

                    <div class="form-group">
                        <label for="bank_name">Bank Name</label>
                        <input type="text" id="bank_name" name="bank_name" required placeholder="Enter your bank name">
                    </div>

                    <div class="form-group">
                        <label for="account_number">Account Number</label>
                        <input type="text" id="account_number" name="account_number" required placeholder="Enter your account number">
                    </div>

                    <div class="form-group">
                        <label for="account_name">Account Name</label>
                        <input type="text" id="account_name" name="account_name" required placeholder="Enter your account name">
                    </div>

                    <button type="submit" class="btn-primary">Request Withdrawal</button>
                </form>
            </div>

            <!-- Withdrawal History -->
            <div class="table-section">
                <h2>Withdrawal History</h2>
                <div id="withdrawalTableContainer">
                    <p class="empty-message">No withdrawal requests yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAgentInfo();
            loadWithdrawals();
        });

        function loadAgentInfo() {
            fetch('/api/agent/dashboard')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('agentName').textContent = 'Welcome, ' + data.agent.full_name;
                    document.getElementById('agentRank').textContent = data.agent.rank.toUpperCase();
                    document.getElementById('availableBalance').textContent = '₦' + data.stats.balance.toLocaleString();
                }
            })
            .catch(error => {
                console.error('Error loading agent info:', error);
            });
        }

        function loadWithdrawals() {
            fetch('/api/agent/withdrawals')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const withdrawals = data.withdrawals;
                    const container = document.getElementById('withdrawalTableContainer');

                    if (withdrawals.length === 0) {
                        container.innerHTML = '<p class="empty-message">No withdrawal requests yet.</p>';
                        return;
                    }

                    let tableHtml = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Amount</th>
                                    <th>Bank</th>
                                    <th>Account</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    withdrawals.forEach(function(w) {
                        const statusClass = w.status === 'approved' ? 'status-approved' :
                                           w.status === 'pending' ? 'status-pending' : 'status-rejected';

                        tableHtml += `
                            <tr>
                                <td>₦${w.amount.toLocaleString()}</td>
                                <td>${w.bank_name || 'N/A'}</td>
                                <td>${w.account_number || 'N/A'}</td>
                                <td><span class="status-badge ${statusClass}">${w.status}</span></td>
                                <td>${w.request_date}</td>
                            </tr>
                        `;
                    });

                    tableHtml += `
                            </tbody>
                        </table>
                    `;

                    container.innerHTML = tableHtml;
                }
            })
            .catch(error => {
                console.error('Error loading withdrawals:', error);
            });
        }

        function handleWithdraw(event) {
            event.preventDefault();

            const amount = document.getElementById('amount').value;
            const bank_name = document.getElementById('bank_name').value;
            const account_number = document.getElementById('account_number').value;
            const account_name = document.getElementById('account_name').value;
            const messageDiv = document.getElementById('message');

            messageDiv.classList.add('hidden');

            if (parseFloat(amount) < 10000) {
                showMessage('Minimum withdrawal amount is ₦10,000.', 'error');
                return;
            }

            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Submitting...';
            submitBtn.disabled = true;

            fetch('/api/agent/withdraw', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    amount: amount,
                    bank_name: bank_name,
                    account_number: account_number,
                    account_name: account_name
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(data.message, 'success');
                    document.getElementById('withdrawForm').reset();
                    loadAgentInfo();
                    loadWithdrawals();
                    submitBtn.textContent = 'Request Withdrawal';
                    submitBtn.disabled = false;
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.textContent = 'Request Withdrawal';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                showMessage('An error occurred. Please try again.', 'error');
                submitBtn.textContent = 'Request Withdrawal';
                submitBtn.disabled = false;
            });
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch('/api/agent/logout', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    window.location.href = '/agent/login';
                })
                .catch(error => {
                    window.location.href = '/agent/login';
                });
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.classList.remove('hidden');

            setTimeout(function() {
                messageDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
