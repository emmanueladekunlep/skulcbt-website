<!-- sales.html -->
<!-- Admin Sales Management Page for SkulCBT Agent Program -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sales - SkulCBT Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .sidebar-overlay.active {
            display: block;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger-btn {
                display: block !important;
                background: none;
                border: none;
                font-size: 28px;
                color: #0B1E36;
                cursor: pointer;
                padding: 8px 12px;
                border-radius: 8px;
            }
            .top-bar {
                flex-direction: row !important;
                align-items: center !important;
            }
            .top-bar-left {
                display: flex !important;
                align-items: center !important;
                gap: 10px !important;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 10px !important;
            }
            .stat-card p {
                font-size: 20px !important;
            }
            .top-bar h1 {
                font-size: 20px !important;
            }
            .table-section {
                padding: 14px 16px !important;
                overflow-x: auto !important;
            }
            .data-table {
                font-size: 12px !important;
                min-width: 750px !important;
            }
            .data-table th,
            .data-table td {
                padding: 8px 10px !important;
            }
            .sidebar-logo {
                display: flex !important;
                align-items: center !important;
                gap: 10px !important;
            }
            .sidebar-logo p {
                display: block !important;
            }
            .agent-info {
                flex-wrap: wrap !important;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr !important;
                gap: 8px !important;
            }
            .stat-card {
                padding: 14px 16px !important;
            }
            .stat-card p {
                font-size: 18px !important;
            }
            .stat-card h3 {
                font-size: 11px !important;
            }
            .data-table {
                font-size: 11px !important;
                min-width: 600px !important;
            }
            .data-table th,
            .data-table td {
                padding: 6px 8px !important;
            }
            .btn-action {
                font-size: 11px !important;
                padding: 4px 8px !important;
                margin: 2px !important;
            }
            .sidebar-nav a {
                font-size: 12px !important;
                padding: 6px 10px !important;
            }
            .top-bar h1 {
                font-size: 18px !important;
            }
        }
        @media (min-width: 769px) {
            .hamburger-btn {
                display: none !important;
            }
            .sidebar-overlay {
                display: none !important;
            }
        }
        .btn-action {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            opacity: 0.8;
        }
        .btn-action.btn-approve {
            background: #48bb78;
            color: white;
        }
        .btn-action.btn-approve:hover {
            background: #38a169;
        }
        .btn-action.btn-reject {
            background: #fc8181;
            color: white;
        }
        .btn-action.btn-reject:hover {
            background: #e53e3e;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-approved {
            background: #c6f6d5;
            color: #22543d;
        }
        .status-pending {
            background: #fefcbf;
            color: #744210;
        }
        .status-rejected {
            background: #fed7d7;
            color: #9b2c2c;
        }
        .message {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #48bb78;
        }
        .message.error {
            background: #fed7d7;
            color: #9b2c2c;
            border: 1px solid #fc8181;
        }
        .message.hidden {
            display: none;
        }
        .empty-message {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="/static/images/skulcbt-logo.png" alt="SkulCBT Logo" style="height: 40px; width: auto; margin-bottom: 6px;">
                <h2>Skul<span style="color: #D4AF37;">CBT</span></h2>
                <p>Admin Portal</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/agents">Agents</a>
                <a href="/admin/sales" class="active">Sales</a>
                <a href="/admin/licenses">Licenses</a>
                <a href="/admin/withdrawals">Withdrawals</a>
                <a href="/admin/reports">Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="handleLogout()" class="btn-logout">Logout</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
                    <h1>Manage Sales</h1>
                </div>
                <div class="agent-info">
                    <span>Administrator</span>
                </div>
            </div>

            <div id="message" class="message hidden"></div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <p id="totalSales">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <p id="totalRevenue">₦0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending Approval</h3>
                    <p id="pendingSales">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Commission</h3>
                    <p id="totalCommission">₦0</p>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="table-section">
                <h2>All Sales</h2>
                <div id="salesTableContainer">
                    <p class="empty-message">Loading sales...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSales();
        });

        function loadSales() {
            const container = document.getElementById('salesTableContainer');

            fetch('/api/admin/sales', {
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const sales = data.sales;

                    document.getElementById('totalSales').textContent = data.stats.total_sales;
                    document.getElementById('totalRevenue').textContent = '₦' + data.stats.total_revenue.toLocaleString();
                    document.getElementById('totalCommission').textContent = '₦' + data.stats.total_commission.toLocaleString();
                    document.getElementById('pendingSales').textContent = data.stats.pending_sales || 0;

                    if (sales.length === 0) {
                        container.innerHTML = '<p class="empty-message">No sales recorded yet.</p>';
                        return;
                    }

                    let tableHtml = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Agent</th>
                                    <th>School</th>
                                    <th>Tier</th>
                                    <th>Plan</th>
                                    <th>Price</th>
                                    <th>Commission</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    sales.forEach(function(sale) {
                        const statusClass = sale.status === 'approved' ? 'status-approved' :
                                           sale.status === 'pending' ? 'status-pending' : 'status-rejected';

                        let actionButtons = '';
                        if (sale.status === 'pending') {
                            actionButtons = `
                                <button class="btn-action btn-approve" onclick="approveSale(${sale.id})">Approve</button>
                                <button class="btn-action btn-reject" onclick="rejectSale(${sale.id})">Reject</button>
                            `;
                        } else {
                            actionButtons = `<span style="color: #a0aec0; font-size: 12px;">Completed</span>`;
                        }

                        tableHtml += `
                            <tr>
                                <td>Agent #${sale.agent_id}</td>
                                <td><strong>${sale.school_name}</strong></td>
                                <td>${sale.tier}</td>
                                <td>${sale.plan}</td>
                                <td>₦${sale.price.toLocaleString()}</td>
                                <td>₦${sale.commission.toLocaleString()}</td>
                                <td><span class="status-badge ${statusClass}">${sale.status}</span></td>
                                <td>${sale.sale_date}</td>
                                <td>${actionButtons}</td>
                            </tr>
                        `;
                    });

                    tableHtml += `
                            </tbody>
                        </table>
                    `;

                    container.innerHTML = tableHtml;
                } else {
                    container.innerHTML = '<p class="empty-message">Error loading sales: ' + (data.message || 'Unknown error') + '</p>';
                }
            })
            .catch(error => {
                container.innerHTML = '<p class="empty-message">Error loading sales. Please refresh the page.</p>';
                console.error('Error:', error);
            });
        }

        function approveSale(saleId) {
            if (!confirm('Approve this sale? This will generate a license key and credit commissions.')) {
                return;
            }

            showMessage('Processing approval...', 'success');

            fetch('/api/admin/sales/approve/' + saleId, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    loadSales();
                } else {
                    showMessage('❌ ' + (data.message || 'Error approving sale.'), 'error');
                }
            })
            .catch(error => {
                showMessage('❌ Network error: ' + error.message, 'error');
                console.error('Error:', error);
            });
        }

        function rejectSale(saleId) {
            if (!confirm('Reject this sale?')) {
                return;
            }

            fetch('/api/admin/sales/reject/' + saleId, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage('✅ Sale rejected.', 'success');
                    loadSales();
                } else {
                    showMessage('❌ ' + (data.message || 'Error rejecting sale.'), 'error');
                }
            })
            .catch(error => {
                showMessage('❌ Network error: ' + error.message, 'error');
                console.error('Error:', error);
            });
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                })
                .then(response => response.json())
                .then(data => {
                    window.location.href = '/admin/login';
                })
                .catch(error => {
                    window.location.href = '/admin/login';
                });
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.classList.remove('hidden');

            setTimeout(function() {
                messageDiv.classList.add('hidden');
            }, 6000);
        }
    </script>
</body>
</html>
