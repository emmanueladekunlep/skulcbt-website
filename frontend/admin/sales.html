<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Sales - SkulCBT Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <img src="/static/images/skulcbt-logo.png" alt="SkulCBT Logo" style="height: 40px; width: auto; margin-bottom: 8px;">
                <h2>Skul<span style="color: #D4AF37;">CBT</span></h2>
                <p>Admin Portal</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/agents">Agents</a>
                <a href="/admin/sales" class="active">Sales</a>
                <a href="/admin/licenses">Licenses</a>
                <a href="/admin/withdrawals">Withdrawals</a>
                <a href="/admin/reports">Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="handleLogout()" class="btn-logout">Logout</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <h1>Manage Sales</h1>
                <div class="agent-info">
                    <span>Administrator</span>
                </div>
            </div>

            <div id="message" class="message hidden"></div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Sales</h3>
                    <p id="totalSales">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <p id="totalRevenue">₦0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending Approval</h3>
                    <p id="pendingSales">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Commission</h3>
                    <p id="totalCommission">₦0</p>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="table-section">
                <h2>All Sales</h2>
                <div id="salesTableContainer">
                    <p class="empty-message">Loading sales...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadSales();
        });

        function loadSales() {
            const container = document.getElementById('salesTableContainer');

            fetch('/api/admin/sales')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const sales = data.sales;

                    document.getElementById('totalSales').textContent = data.stats.total_sales;
                    document.getElementById('totalRevenue').textContent = '₦' + data.stats.total_revenue.toLocaleString();
                    document.getElementById('totalCommission').textContent = '₦' + data.stats.total_commission.toLocaleString();
                    document.getElementById('pendingSales').textContent = data.stats.pending_sales || 0;

                    if (sales.length === 0) {
                        container.innerHTML = '<p class="empty-message">No sales recorded yet.</p>';
                        return;
                    }

                    let tableHtml = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Agent</th>
                                    <th>School</th>
                                    <th>Tier</th>
                                    <th>Plan</th>
                                    <th>Price</th>
                                    <th>Commission</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    sales.forEach(function(sale) {
                        const statusClass = sale.status === 'approved' ? 'status-approved' :
                                           sale.status === 'pending' ? 'status-pending' : 'status-rejected';

                        let actionButtons = '';
                        if (sale.status === 'pending') {
                            actionButtons = `
                                <button class="btn-action" onclick="approveSale(${sale.id})">Approve</button>
                                <button class="btn-action btn-reject" onclick="rejectSale(${sale.id})">Reject</button>
                            `;
                        } else {
                            actionButtons = `<span style="color: #a0aec0; font-size: 12px;">Completed</span>`;
                        }

                        tableHtml += `
                            <tr>
                                <td>Agent #${sale.agent_id}</td>
                                <td>${sale.school_name}</td>
                                <td>${sale.tier}</td>
                                <td>${sale.plan}</td>
                                <td>₦${sale.price.toLocaleString()}</td>
                                <td>₦${sale.commission.toLocaleString()}</td>
                                <td><span class="status-badge ${statusClass}">${sale.status}</span></td>
                                <td>${sale.sale_date}</td>
                                <td>${actionButtons}</td>
                            </tr>
                        `;
                    });

                    tableHtml += `
                            </tbody>
                        </table>
                    `;

                    container.innerHTML = tableHtml;
                } else {
                    container.innerHTML = '<p class="empty-message">Error loading sales.</p>';
                }
            })
            .catch(error => {
                container.innerHTML = '<p class="empty-message">Error loading sales.</p>';
                console.error('Error:', error);
            });
        }

        function approveSale(saleId) {
            if (confirm('Approve this sale? This will generate a license key and send it to the school.')) {
                fetch('/api/admin/sales/approve/' + saleId, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showMessage(data.message, 'success');
                        loadSales();
                    } else {
                        showMessage(data.message || 'Error approving sale.', 'error');
                    }
                })
                .catch(error => {
                    showMessage('Error approving sale.', 'error');
                });
            }
        }

        function rejectSale(saleId) {
            if (confirm('Reject this sale?')) {
                fetch('/api/admin/sales/reject/' + saleId, {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Sale rejected.', 'success');
                        loadSales();
                    } else {
                        showMessage('Error rejecting sale.', 'error');
                    }
                })
                .catch(error => {
                    showMessage('Error rejecting sale.', 'error');
                });
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch('/api/admin/logout', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    window.location.href = '/admin/login';
                })
                .catch(error => {
                    window.location.href = '/admin/login';
                });
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.classList.remove('hidden');

            setTimeout(function() {
                messageDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
