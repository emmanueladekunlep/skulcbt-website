<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Agents - SkulCBT Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-logo">
                <img src="/static/images/skulcbt-logo.png" alt="SkulCBT Logo" style="height: 40px; width: auto; margin-bottom: 8px;">
                <h2>Skul<span style="color: #D4AF37;">CBT</span></h2>
                <p>Admin Portal</p>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard">Dashboard</a>
                <a href="/admin/agents" class="active">Agents</a>
                <a href="/admin/sales">Sales</a>
                <a href="/admin/licenses">Licenses</a>
                <a href="/admin/withdrawals">Withdrawals</a>
                <a href="/admin/reports">Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button onclick="handleLogout()" class="btn-logout">Logout</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="top-bar">
                <h1>Manage Agents</h1>
                <div class="agent-info">
                    <span>Administrator</span>
                </div>
            </div>

            <div id="message" class="message hidden"></div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Agents</h3>
                    <p id="totalAgents">0</p>
                </div>
                <div class="stat-card">
                    <h3>Active</h3>
                    <p id="activeAgents">0</p>
                </div>
                <div class="stat-card">
                    <h3>Free Registrations Used</h3>
                    <p id="freeRegistrations">0 / 50</p>
                </div>
            </div>

            <!-- Agent Table -->
            <div class="table-section">
                <h2>All Agents</h2>
                <div id="agentTableContainer">
                    <p class="empty-message">Loading agents...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAgents();
            loadStats();
        });

        function loadStats() {
            fetch('/api/admin/dashboard')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('totalAgents').textContent = data.stats.total_agents;
                    document.getElementById('activeAgents').textContent = data.stats.active_agents;
                    document.getElementById('freeRegistrations').textContent = '0 / 50';
                }
            })
            .catch(error => {
                console.error('Error loading stats:', error);
            });
        }

        function loadAgents() {
            const container = document.getElementById('agentTableContainer');
            
            fetch('/api/admin/agents')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const agents = data.agents;

                    if (agents.length === 0) {
                        container.innerHTML = '<p class="empty-message">No agents registered yet.</p>';
                        return;
                    }

                    let tableHtml = `
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Referral Code</th>
                                    <th>Rank</th>
                                    <th>Sales</th>
                                    <th>Commission</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    agents.forEach(function(agent) {
                        tableHtml += `
                            <tr>
                                <td>${agent.full_name}</td>
                                <td>${agent.email}</td>
                                <td>${agent.phone}</td>
                                <td>${agent.referral_code}</td>
                                <td><span class="rank-badge">${agent.rank}</span></td>
                                <td>${agent.total_sales}</td>
                                <td>₦${(agent.total_commission || 0).toLocaleString()}</td>
                                <td>
                                    <button class="btn-action btn-delete" onclick="deleteAgent(${agent.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    });

                    tableHtml += `
                            </tbody>
                        </table>
                    `;

                    container.innerHTML = tableHtml;
                } else {
                    container.innerHTML = '<p class="empty-message">Error loading agents.</p>';
                }
            })
            .catch(error => {
                container.innerHTML = '<p class="empty-message">Error loading agents.</p>';
                console.error('Error:', error);
            });
        }

        function deleteAgent(agentId) {
            if (confirm('Are you sure you want to delete this agent? This action cannot be undone.')) {
                fetch('/api/admin/agents/delete/' + agentId, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Agent deleted successfully.', 'success');
                        loadAgents();
                        loadStats();
                    } else {
                        showMessage('Error deleting agent.', 'error');
                    }
                })
                .catch(error => {
                    showMessage('Error deleting agent.', 'error');
                });
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                fetch('/api/admin/logout', {
                    method: 'POST'
                })
                .then(response => response.json())
                .then(data => {
                    window.location.href = '/admin/login';
                })
                .catch(error => {
                    window.location.href = '/admin/login';
                });
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.classList.remove('hidden');

            setTimeout(function() {
                messageDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
